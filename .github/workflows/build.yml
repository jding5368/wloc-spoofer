name: Build IPA

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f src.zip ]; then unzip -q src.zip
          else base64 -d src.b64 > src.zip && unzip -q src.zip
          fi
      - run: brew install xcodegen
      - run: |
          cd hok_esp_ipa
          xcodegen generate
          xcodebuild -project ScreenTool.xcodeproj -scheme ScreenTool -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          cd hok_esp_ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenTool.app Payload/
          find Payload -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          zip -qry ScreenTool.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTool-IPA
          path: hok_esp_ipa/ScreenTool.ipa
